[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriapi"
version = "0.1.0"
description = "VeriApi.Pro resmî Python istemcisi: döviz, hava, namaz, deprem, il/ilçe"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["veriapi", "turkiye", "doviz", "hava", "namaz", "deprem"]

[project.urls]
Homepage = "https://veriapi.pro"
Documentation = "https://veriapi.pro/dokumantasyon"
Source = "https://github.com/veriapipro/veriapi-python"
Issues = "https://github.com/veriapipro/veriapi-python/issues"

[tool.setuptools]
packages = ["veriapi"]

[tool.setuptools.package-data]
veriapi = ["py.typed"]
